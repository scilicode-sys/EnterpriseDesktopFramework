name: Framework CI

# Pipeline dédié au socle Framework : build Release + suite xUnit à chaque
# push/PR touchant les briques du framework. Windows obligatoire : DPAPI,
# WPF et assistant réseau sont des briques net8.0-windows.

on:
  push:
    branches: [main, master]
    paths:
      - 'Framework.Core/**'
      - 'Framework.Data/**'
      - 'Framework.Common/**'
      - 'Framework.WPF/**'
      - 'Framework.Tests/**'
      - 'Framework.sln'
      - '.github/workflows/framework-ci.yml'
  pull_request:
    paths:
      - 'Framework.Core/**'
      - 'Framework.Data/**'
      - 'Framework.Common/**'
      - 'Framework.WPF/**'
      - 'Framework.Tests/**'
      - 'Framework.sln'
      - '.github/workflows/framework-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Release + suite de tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Framework.sln

      - name: Build (Release — zéro erreur exigée)
        run: dotnet build Framework.sln -c Release --no-restore

      - name: Tests xUnit
        run: dotnet test Framework.Tests -c Release --no-build --logger "trx;LogFileName=framework-tests.trx"

      - name: Publier le rapport de tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Framework xUnit results
          path: Framework.Tests/TestResults/framework-tests.trx
          reporter: dotnet-trx
